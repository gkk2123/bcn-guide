<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>바르셀로나 맛집·명소 가이드</title>
<style>
:root{--bg:#EDF0EB;--card:#FBFCFA;--ink:#18202C;--ink-2:#4A5464;--line:#D2D8CF;--accent:#2546A6;--on-accent:#FFFFFF;--err:#B1362A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10151D;--card:#18202A;--ink:#E6EAF0;--ink-2:#A9B3C1;--line:#2D3745;--accent:#93B0F4;--on-accent:#0E1421;--err:#F0897B;color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  word-break:keep-all;overflow-wrap:anywhere}
form{width:min(100%,380px);display:grid;gap:14px;padding:28px 24px;background:var(--card);border:1px solid var(--line);border-radius:12px}
h1{margin:0;font-size:22px;line-height:1.35;text-wrap:balance}
h1 span{display:block;margin-top:4px;font-size:15px;font-weight:500;color:var(--ink-2)}
label{font-size:15px;font-weight:600}
#p{width:100%;min-height:52px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:600 22px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.25em}
.rem{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;font-weight:400;color:var(--ink-2);cursor:pointer}
.rem input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
button{min-height:52px;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);font:inherit;font-size:18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{margin:0;min-height:1.6em;font-size:14px;color:var(--err)}
.msg.wait{color:var(--ink-2)}
.busy form{visibility:hidden}
</style>
</head>
<body class="busy">
<form id="f">
  <h1>바르셀로나 맛집·명소 가이드<span>출장 중 짬이 날 때 보는 식당·바·명소 모음</span></h1>
  <label for="p">비밀번호</label>
  <input id="p" type="password" inputmode="numeric" autocomplete="current-password" required>
  <label class="rem"><input id="r" type="checkbox" checked><span>이 기기에서 기억하기</span></label>
  <button id="b" type="submit">들어가기</button>
  <p class="msg" id="m" role="status" aria-live="polite"></p>
</form>
<noscript><p>JavaScript를 켜 주세요</p></noscript>

    }).then(show,function(){b.disabled=false;p.select();say('비밀번호가 맞지 않아요');});
  });
  var saved=null; try{saved=localStorage.getItem(K);}catch(e){}
  if(saved){   // any failure here (bad stored value, page re-built with a new salt or password) just asks again
    Promise.resolve().then(function(){return crypto.subtle.importKey('raw',bytes(saved),'AES-GCM',false,['decrypt']);})
      .then(decrypt).then(show).catch(function(){try{localStorage.removeItem(K);}catch(e){} ready();});
  } else ready();
})();
</script>
